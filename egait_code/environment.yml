name: egait
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy=1.25.2
  - scipy=1.11.4
  - matplotlib
  - pandas=1.5.2
  - scikit-learn=1.3.2
  - scikit-image=0.22.0
  - opencv
  - pybullet
  - mpi4py
  - mpich
  - cython
  - pyzmq
  - tqdm
  - pyyaml
  - pillow
  - optuna
  - cmaes
  - attrs
  - pip:
      - imageio>=2.27
      - pygame
      - pyglet==2.0.7
      - gym==0.25.2  # newer version that avoids setup.py metadata issues
      - stable-baselines==2.10.2
      # stable-baselines3==1.8.0
      - pickle5==0.0.11
      - protobuf==3.19.6
      - pydantic==1.10.2
      - wget==3.2
      - triton==3.3.0
      - furl==2.1.3
      - zarr==2.16.1
      - yahoo-finance==1.4.0
      - tensorflow==2.11.0
      - quadprog
      - pytorch
      - torchvision
      - torchaudio
